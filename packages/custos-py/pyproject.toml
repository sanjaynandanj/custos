[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custos-mcp"
version = "0.1.0"
description = "Runtime governance, policy enforcement, and cryptographic audit ledger for MCP tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Custos contributors"}]
keywords = ["mcp", "governance", "policy", "audit", "ed25519", "ledger", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cryptography>=41.0",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1"]
otel = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
cedar = ["cedarpy>=4.0"]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]
all = ["custos-mcp[web,otel,cedar,langgraph,dev]"]

[project.scripts]
custos = "custos.cli:main"

[project.urls]
Homepage = "https://github.com/sanjaynandanj/custos"
Documentation = "https://github.com/sanjaynandanj/custos"
Repository = "https://github.com/sanjaynandanj/custos"

[tool.hatch.build.targets.wheel]
packages = ["src/custos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
